<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Certificados - IFCE Boa Viagem</title>
  <style>
    :root { --ifce-green: #2f8132; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
    .container { max-width: 850px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
    h2 { color: var(--ifce-green); border-bottom: 2px solid var(--ifce-green); padding-bottom: 10px; margin-top: 0; }
    .form-group { margin-bottom: 15px; min-width: 0; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    .form-row { display: flex; gap: 15px; }
    .form-row > .form-group { flex: 1; }
    #team-section { background: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px solid #eee; margin: 20px 0; }
    .team-member-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .member-id { max-width: 180px; }
    button { padding: 10px 20px; cursor: pointer; border: 0; border-radius: 4px; font-weight: bold; transition: .2s; }
    .btn-add { background: #e0e0e0; color: #333; }
    .btn-remove { background: #ffeded; color: #a60000; padding: 5px 15px; }
    .btn-generate { background: var(--ifce-green); color: #fff; width: 100%; font-size: 1.1rem; margin-top: 10px; }
    #certificates-container { display: none; }
    .certificate-page { width: 297mm; height: 210mm; padding: 15mm 20mm; border: 15px solid var(--ifce-green); background: #fff; display: flex; flex-direction: column; justify-content: space-between; break-after: page; page-break-after: always; overflow: hidden; }
    .certificate-page:last-child { break-after: auto; page-break-after: auto; }
    .cert-header { display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #333; padding-bottom: 15px; gap: 25px; }
    .cert-logo { height: 90px; width: auto; }
    .cert-header-text { text-align: center; }
    .cert-header-text h3 { margin: 0; font-size: 1.4rem; }
    .cert-header-text h4 { margin: 5px 0; font-size: 1.1rem; font-weight: normal; }
    .cert-header-text p { margin: 0; font-size: 1rem; }
    .cert-content { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
    .cert-title { font-size: 4rem; color: var(--ifce-green); margin: 0 0 25px; font-family: 'Times New Roman', serif; }
    .cert-text { font-size: 1.35rem; text-align: justify; line-height: 1.65; margin: 0 auto; max-width: 95%; overflow-wrap: anywhere; }
    .cert-footer { text-align: center; margin-top: 20px; }
    .signature-line { width: 50%; margin: 0 auto 10px; border-top: 2px solid #333; }
    .signature-name { font-size: 1.1rem; margin: 5px 0; font-weight: bold; }
    .signature-role { font-size: .95rem; margin: 3px 0; }
    .certificate-date { font-size: .95rem; font-weight: normal; margin-top: 15px; }
    @media (max-width: 650px) { .form-row { flex-direction: column; gap: 0; } .team-member-row { flex-wrap: wrap; } .member-id { max-width: none; } }
    @page { size: A4 landscape; margin: 0; }
    @media print {
      html, body { margin: 0; padding: 0; background: white; }
      .container { display: none !important; }
      #certificates-container { display: block !important; }
      .certificate-page { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h2>Gerador de Certificados Individuais</h2>
    <form id="certificate-form">
      <div class="form-group">
        <label for="sysName">Nome do Sistema Desenvolvido:</label>
        <input type="text" id="sysName" placeholder="Ex: Sistema de PDV" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="advisorTitle">Titulação do Professor:</label>
          <select id="advisorTitle">
            <option value="Prof.">Prof.</option>
            <option value="Prof. Esp.">Prof. Esp.</option>
            <option value="Prof. Me.">Prof. Me.</option>
            <option value="Prof. Dr." selected>Prof. Dr.</option>
          </select>
        </div>
        <div class="form-group" style="flex: 2;">
          <label for="advisorName">Nome do Professor Responsável / Orientador:</label>
          <input type="text" id="advisorName" placeholder="Ex: Renato William Rodrigues de Souza" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="discipline">Disciplina:</label>
          <input type="text" id="discipline" value="Projeto Integrador" required>
        </div>
        <div class="form-group">
          <label for="workload">Carga Horária (horas):</label>
          <input type="number" id="workload" value="80" min="1" step="1" required>
        </div>
        <div class="form-group">
          <label for="semester">Semestre Corrente:</label>
          <input type="text" id="semester" placeholder="Ex: 2026.2" required>
        </div>
      </div>
      <div class="form-group">
        <label for="clientName">Cliente Externo Atendido:</label>
        <input type="text" id="clientName" placeholder="Ex: Clínica Odontológica X" required>
      </div>
      <div id="team-section">
        <label>Alunos da Equipe:</label>
        <div class="team-member-row">
          <input type="text" class="member-name" placeholder="Nome do Aluno" aria-label="Nome do aluno" required>
          <input type="text" class="member-id" placeholder="Matrícula" aria-label="Matrícula do aluno" required>
          <button type="button" class="btn-remove" onclick="removeMember(this)" aria-label="Remover aluno">×</button>
        </div>
      </div>
      <button type="button" class="btn-add" onclick="addMember()">+ Adicionar Aluno</button>
      <button type="submit" class="btn-generate">Gerar Certificados Individuais</button>
    </form>
  </main>
  <div id="certificates-container"></div>
  <script>
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function addMember() {
      const row = document.createElement('div');
      row.className = 'team-member-row';
      row.innerHTML = `
        <input type="text" class="member-name" placeholder="Nome do Aluno" aria-label="Nome do aluno" required>
        <input type="text" class="member-id" placeholder="Matrícula" aria-label="Matrícula do aluno" required>
        <button type="button" class="btn-remove" onclick="removeMember(this)" aria-label="Remover aluno">×</button>
      `;
      document.getElementById('team-section').appendChild(row);
    }

    function removeMember(button) {
      const rows = document.querySelectorAll('.team-member-row');
      if (rows.length === 1) {
        alert('É necessário manter pelo menos um aluno na equipe.');
        return;
      }
      button.closest('.team-member-row').remove();
    }

    function generateCertificates(event) {
      event.preventDefault();
      const form = document.getElementById('certificate-form');
      if (!form.reportValidity()) return;

      const get = id => document.getElementById(id).value.trim();
      const sysName = get('sysName');
      const advisorName = get('advisorName');
      const advisorTitle = get('advisorTitle');
      const discipline = get('discipline');
      const workload = Number(get('workload'));
      const semester = get('semester');
      const clientName = get('clientName');
      const memberRows = Array.from(document.querySelectorAll('.team-member-row'));
      const container = document.getElementById('certificates-container');

      if (!sysName || !advisorName || !discipline || !semester || !clientName ||
          !Number.isInteger(workload) || workload <= 0 || memberRows.length === 0 ||
          memberRows.some(row => !row.querySelector('.member-name').value.trim() ||
                                 !row.querySelector('.member-id').value.trim())) {
        alert('Preencha corretamente todos os campos, inclusive nome e matrícula de cada aluno.');
        return;
      }

      const today = new Date();
      const formattedDate = `Boa Viagem, ${today.getDate()} de ${today.toLocaleString('pt-BR', { month: 'long' })} de ${today.getFullYear()}.`;
      const professor = `${advisorTitle} ${advisorName}`;
      const pages = memberRows.map(row => {
        const name = row.querySelector('.member-name').value.trim();
        const id = row.querySelector('.member-id').value.trim();
        return `
          <div class="certificate-page">
            <div class="cert-header">
              <img src="imagelogo.png" alt="Logo IFCE" class="cert-logo">
              <div class="cert-header-text">
                <h3>INSTITUTO FEDERAL DO CEARÁ - CAMPUS BOA VIAGEM</h3>
                <h4>Curso de Tecnologia em Análise e Desenvolvimento de Sistemas</h4>
                <p>Boa Viagem - Ceará</p>
              </div>
            </div>
            <div class="cert-content">
              <h1 class="cert-title">CERTIFICADO</h1>
              <div class="cert-text">
                Certificamos que o(a) aluno(a) <strong>${escapeHTML(name)}</strong>, matrícula
                <strong>${escapeHTML(id)}</strong>, concluiu com êxito a disciplina de
                <strong>${escapeHTML(discipline)}</strong> no semestre <strong>${escapeHTML(semester)}</strong>.
                O(A) estudante participou ativamente do desenvolvimento do sistema
                <strong>“${escapeHTML(sysName)}”</strong>, realizado para o cliente externo
                <strong>${escapeHTML(clientName)}</strong>, sob a orientação do(a) professor(a)
                <strong>${escapeHTML(professor)}</strong>, com carga horária total de
                <strong>${workload} horas</strong>.
              </div>
            </div>
            <div class="cert-footer">
              <div class="signature-line"></div>
              <p class="signature-name"><strong>${escapeHTML(professor)}</strong></p>
              <p class="signature-role">Professor Responsável pela Disciplina / Orientador</p>
              <p class="certificate-date">${formattedDate}</p>
            </div>
          </div>`;
      });

      container.innerHTML = pages.join('');
      const logo = container.querySelector('.cert-logo');
      if (logo && !logo.complete) {
        logo.addEventListener('load', () => window.print(), { once: true });
        logo.addEventListener('error', () => window.print(), { once: true });
      } else {
        window.print();
      }
    }

    document.getElementById('certificate-form').addEventListener('submit', generateCertificates);
  </script>
</body>
</html>
